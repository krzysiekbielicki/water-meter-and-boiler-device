# FILE REFERENCES
# ============================================================================
#
# For detailed information, refer to component-specific files:
#
# - esphome-cc1101.yaml:  CC1101 RF receiver configuration and notes
# - esphome-rs485.yaml:   RS-485 UART and pyplumio integration guide
# - esphome-mqtt.yaml:    WiFi and MQTT configuration options
# - hardware-config.md:   Complete GPIO pin mapping and electrical specs
# - secrets-template.yaml: Template for required secrets entries
#

