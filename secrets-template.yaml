# ESPHome Secrets Configuration Template
# Copy this file to secrets.yaml and fill in your actual values
# Keep secrets.yaml secure and never commit it to version control

# WiFi Network Configuration
wifi_ssid: "Your WiFi Network Name"
wifi_password: "Your WiFi Password"
fallback_ap_password: "Fallback123!@#"

# MQTT Broker Configuration
mqtt_broker: "192.168.1.100"           # IP address or hostname of broker
mqtt_username: "mqtt_user"             # MQTT broker username
mqtt_password: "mqtt_password"         # MQTT broker password

# ESPHome API Configuration (for OTA updates and Home Assistant)
api_encryption_key: "your-base64-encoded-encryption-key-here"
api_password: "your_api_password"

# OTA Update Configuration
ota_password: "your_ota_password"
