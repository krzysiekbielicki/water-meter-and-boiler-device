esphome:
  name: water-meter-wmbus
  friendly_name: Water Meter WMBus

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "WaterMeter-WMBus-Fallback"
    password: !secret fallback_ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: true

time:
  - platform: sntp
    id: time_sntp

external_components:
  - source: github://SzczepanLeon/esphome-components@main
    components: [wmbus_radio, wmbus_common, wmbus_meter]

spi:
  clk_pin: GPIO3
  mosi_pin: GPIO4
  miso_pin: GPIO1

# Discovery mode: log all wM-Bus frames from nearby meters.
# Using upstream SzczepanLeon wmbus_radio (FIFOTHR=32 bytes for FIFO overflow protection).
wmbus_radio:
  radio_type: CC1101
  cs_pin: GPIO10
  irq_pin: GPIO7
  frequency: 868.95MHz
  on_frame:
    - then:
        - logger.log:
            format: "WMBus RSSI=%ddBm mode=%s data=%s"
            args: [ 'frame->rssi()', 'toString(frame->link_mode())', 'frame->as_hex().c_str()' ]
    - then:
        - mqtt.publish:
            topic: home/wmbus/frame_hex
            payload: !lambda return frame->as_hex();
            qos: 0
            retain: false
